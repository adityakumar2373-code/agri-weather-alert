<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisan Weather Alert - Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            /* Beautiful soft mesh gradient background */
            background-color: #f0fdf4;
            background-image: radial-gradient(at 0% 0%, #dcfce7 0px, transparent 50%),
                              radial-gradient(at 100% 0%, #ccfbf1 0px, transparent 50%),
                              radial-gradient(at 100% 100%, #e0e7ff 0px, transparent 50%),
                              radial-gradient(at 0% 100%, #fef3c7 0px, transparent 50%);
            background-attachment: fixed;
        }
        
        /* Custom Scrollbar for Search Results */
        #search-results::-webkit-scrollbar { width: 4px; }
        #search-results::-webkit-scrollbar-thumb { background-color: #10b981; border-radius: 10px; }
        
        /* Hide number arrows in input */
        input[type=tel]::-webkit-inner-spin-button, 
        input[type=tel]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 sm:py-10">

    <div class="max-w-[420px] w-full bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] border border-white overflow-visible relative">
        
        <div class="p-6 sm:p-8 pb-4">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h1 id="app-title" class="text-2xl font-extrabold text-emerald-900 tracking-tight">
                        <i class="fa-solid fa-leaf text-emerald-500 mr-2"></i>AgriAlert
                    </h1>
                    <p id="live-time" class="text-xs font-semibold text-gray-400 mt-1 pl-1 tracking-wide"></p>
                </div>
                <select id="language-selector" class="bg-emerald-50 text-emerald-700 font-semibold text-xs rounded-full px-3 py-1.5 outline-none border border-emerald-100 cursor-pointer hover:bg-emerald-100 transition-colors">
                    <option value="en">English</option>
                    <option value="hi">हिंदी</option>
                    <option value="or">ଓଡ଼ିଆ</option>
                </select>
            </div>

            <p id="select-label" class="text-gray-500 text-sm font-medium mb-2 ml-1">Location</p>
            <div class="relative w-full z-50">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <input type="text" id="location-search" class="w-full bg-white shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-gray-100 rounded-2xl pl-10 p-3.5 outline-none font-semibold text-gray-800 focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition-all" placeholder="Search village or city..." autocomplete="off">
                
                <div id="search-results" class="absolute w-full bg-white mt-2 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.08)] hidden max-h-56 overflow-y-auto border border-gray-100 z-50 overflow-hidden"></div>
            </div>
        </div>

        <div class="px-6 sm:px-8 pb-8 relative z-0">
            
            <div id="loader" class="text-center text-emerald-500 font-bold hidden py-10">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3"></i>
                <p class="text-sm text-gray-500 animate-pulse">Syncing with satellites...</p>
            </div>

            <div id="weather-content" class="text-center mt-2">
                <h2 id="current-weather-title" class="text-emerald-500 text-xs uppercase tracking-widest font-bold mb-4">Live Conditions</h2>
                
                <div class="flex justify-center items-center gap-6 mb-6">
                    <i id="weather-icon" class="fa-solid fa-cloud-sun text-6xl text-blue-400 drop-shadow-md"></i>
                    <h1 id="temperature" class="text-6xl font-black text-gray-800 tracking-tighter">--°</h1>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-8">
                    <div class="bg-gradient-to-br from-blue-50 to-blue-100/50 p-4 rounded-3xl border border-blue-100 shadow-sm flex flex-col items-center">
                        <div class="bg-blue-200/50 w-10 h-10 rounded-full flex items-center justify-center mb-2">
                            <i class="fa-solid fa-droplet text-blue-600"></i>
                        </div>
                        <p id="rain-val" class="text-lg font-bold text-gray-800">-- mm</p>
                        <p id="rain-label" class="text-xs font-medium text-gray-500">Rainfall</p>
                    </div>
                    <div class="bg-gradient-to-br from-teal-50 to-teal-100/50 p-4 rounded-3xl border border-teal-100 shadow-sm flex flex-col items-center">
                        <div class="bg-teal-200/50 w-10 h-10 rounded-full flex items-center justify-center mb-2">
                            <i class="fa-solid fa-wind text-teal-600"></i>
                        </div>
                        <p id="wind-val" class="text-lg font-bold text-gray-800">-- km/h</p>
                        <p id="wind-label" class="text-xs font-medium text-gray-500">Wind Speed</p>
                    </div>
                </div>
            </div>

            <div id="alert-box" class="mt-6 p-4 rounded-2xl hidden shadow-sm transition-all duration-300">
                <div class="flex items-start gap-3">
                    <div class="bg-white/50 w-8 h-8 rounded-full flex items-center justify-center shrink-0">
                        <i id="alert-icon" class="fa-solid fa-triangle-exclamation text-lg"></i>
                    </div>
                    <div>
                        <h3 id="alert-title" class="font-bold text-sm">Agri Alert</h3>
                        <p id="alert-message" class="text-xs mt-1 leading-relaxed opacity-90"></p>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-gray-100/60">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-gray-800">7-Day Forecast</h3>
                    <i class="fa-solid fa-chart-line text-emerald-400"></i>
                </div>
                <div class="relative w-full h-[140px] bg-white rounded-2xl p-2 border border-gray-50 shadow-[0_4px_15px_rgb(0,0,0,0.02)]">
                    <canvas id="forecastChart"></canvas>
                </div>
            </div>

            <div class="mt-8 bg-gray-50/50 rounded-3xl p-5 border border-gray-100">
                <h3 id="sms-heading" class="text-sm font-bold text-gray-800 mb-1">Automated Alerts</h3>
                <p id="sms-help" class="text-xs text-gray-500 mb-4">Receive this advisory via SMS directly to your phone.</p>
                
                <div class="bg-white rounded-2xl p-1.5 flex shadow-sm border border-gray-200 focus-within:border-emerald-400 focus-within:ring-4 focus-within:ring-emerald-50 transition-all duration-300">
                    <div class="flex items-center pl-3 text-gray-400 font-bold text-sm">
                        +91 <span class="mx-2 text-gray-200">|</span>
                    </div>
                    <input type="tel" id="farmer-phone" class="w-full bg-transparent outline-none text-sm font-semibold text-gray-700 placeholder-gray-300" placeholder="Mobile Number" pattern="[0-9]{10}" autocomplete="off">
                    <button id="send-sms-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl w-12 h-10 flex items-center justify-center transition-colors shadow-md shrink-0">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="sms-toast" class="fixed bottom-6 transform translate-y-24 opacity-0 transition-all duration-500 bg-gray-900/95 backdrop-blur-md text-white px-5 py-3.5 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.2)] flex items-center gap-4 z-50 border border-gray-700">
        <div class="bg-emerald-500/20 w-10 h-10 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-check text-emerald-400 text-lg"></i>
        </div>
        <div>
            <p class="font-bold text-sm">Alert Sent</p>
            <p id="toast-number" class="text-xs text-gray-300"></p>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
