<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kisan News - Pro Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://img.icons8.com/parakeet-line/48/emerald-500/leaf.png">
    
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        .bento-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .bento-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.08);
        }

        .news-skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800 overflow-x-hidden">

    <div id="sidebar-overlay" class="fixed inset-0 bg-gray-900/40 z-[60] hidden backdrop-blur-sm transition-opacity opacity-0 duration-300"></div>

    <div id="sidebar-menu" class="fixed top-0 left-0 h-full w-64 sm:w-72 bg-white shadow-2xl z-[70] transform -translate-x-full transition-transform duration-300 flex flex-col border-r border-gray-100">
        <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
            <h2 class="font-extrabold text-gray-900 text-lg flex items-center gap-2">
                <i class="fa-solid fa-leaf text-emerald-500"></i> Menu
            </h2>
            <button id="close-menu-btn" class="text-gray-400 hover:text-red-500 transition-colors p-1">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        
        <nav class="flex-1 overflow-y-auto p-4 space-y-1.5">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3.5 text-gray-600 hover:bg-gray-50 hover:text-emerald-600 rounded-xl font-semibold text-sm transition-colors">
                <i class="fa-solid fa-house w-5 text-center text-lg"></i> Dashboard
            </a>
            <a href="map.html" class="flex items-center gap-3 px-4 py-3.5 text-gray-600 hover:bg-gray-50 hover:text-emerald-600 rounded-xl font-semibold text-sm transition-colors">
                <i class="fa-solid fa-cloud-showers-water w-5 text-center text-lg"></i> Precipitation Map
            </a>
            <a href="news.html" class="flex items-center gap-3 px-4 py-3.5 bg-emerald-50 text-emerald-700 rounded-xl font-bold text-sm transition-colors">
                <i class="fa-solid fa-newspaper w-5 text-center text-lg"></i> Kisan News
            </a>
            <a href="chat.html" class="flex items-center gap-3 px-4 py-3.5 text-gray-600 hover:bg-gray-50 hover:text-emerald-600 rounded-xl font-semibold text-sm transition-colors">
                <i class="fa-solid fa-comments w-5 text-center text-lg"></i> Kisan Chat
            </a>
        </nav>
    </div>
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-lg border-b border-gray-200 shadow-sm w-full">
        <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 py-3 flex justify-between items-center gap-3">
            <div class="flex items-center gap-3 sm:gap-4 flex-1 min-w-0">
                <button id="menu-btn" class="text-gray-500 hover:text-emerald-600 focus:outline-none transition-colors shrink-0">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>

                <div class="bg-gradient-to-br from-emerald-400 to-teal-500 w-8 h-8 rounded-lg flex items-center justify-center shadow-inner shrink-0">
                    <i class="fa-solid fa-leaf text-white text-sm"></i>
                </div>
                <div class="min-w-0 flex-1">
                    <h1 id="app-title" class="text-base sm:text-xl font-extrabold tracking-tight text-gray-900 leading-none truncate">
                        Kisan Alert <span class="text-emerald-500">Pro</span>
                    </h1>
                    <p id="live-time" class="text-[9px] sm:text-[10px] font-bold text-gray-500 tracking-wider uppercase mt-1 truncate"></p>
                </div>
            </div>
            
            <select id="language-selector" class="shrink-0 bg-gray-50 text-gray-700 font-bold text-[11px] sm:text-xs rounded-lg px-2 py-1.5 sm:px-3 sm:py-2 border border-gray-200 outline-none cursor-pointer shadow-sm text-center w-[95px] sm:w-[140px]">
                <option value="en">English</option>
                <option value="hi">हिंदी</option>
                <option value="bn">বাংলা</option>
                <option value="te">తెలుగు</option>
                <option value="mr">मराठी</option>
                <option value="ta">தமிழ்</option>
                <option value="gu">ગુજરાતી</option>
                <option value="kn">ಕನ್ನಡ</option>
                <option value="or">ଓଡ଼ିଆ</option>
                <option value="ml">മലയാളം</option>
                <option value="pa">ਪੰਜਾਬੀ</option>
                <option value="as">অসমীয়া</option>
                <option value="ur">اردو</option>
                <option value="bho">भोजपुरी</option>
            </select>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-8 flex flex-col">
        
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-emerald-500/10 p-3 rounded-xl border border-emerald-500/20 text-emerald-600">
                <i class="fa-solid fa-newspaper text-2xl"></i>
            </div>
            <div>
                <h2 class="text-xl sm:text-2xl font-black text-gray-900 tracking-tight">Kisan News <span class="bg-red-100 text-red-600 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider ml-2 shadow-sm animate-pulse">Live</span></h2>
                <p class="text-sm font-medium text-gray-500">AI-Curated real-time agricultural updates, market trends, and alerts.</p>
            </div>
        </div>

        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
            <div class="bento-card bg-white rounded-[2rem] p-5 sm:p-6 shadow-sm border border-gray-100 w-full h-48 news-skeleton"></div>
            <div class="bento-card bg-white rounded-[2rem] p-5 sm:p-6 shadow-sm border border-gray-100 w-full h-48 news-skeleton"></div>
            <div class="bento-card bg-white rounded-[2rem] p-5 sm:p-6 shadow-sm border border-gray-100 w-full h-48 news-skeleton"></div>
            <div class="bento-card bg-white rounded-[2rem] p-5 sm:p-6 shadow-sm border border-gray-100 w-full h-48 news-skeleton hidden md:block"></div>
        </div>

    </main>

    <footer class="w-full py-6 mt-auto border-t border-gray-200 bg-white">
        <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-4 text-center sm:text-left">
            <p class="text-xs text-gray-500 font-medium truncate w-full sm:w-auto">© 2026 Kisan Alert. All Rights Reserved.</p>
            <p class="text-xs text-gray-500 font-medium bg-gray-50 px-4 py-2 rounded-full border border-gray-100 shrink-0 max-w-full truncate">
                Designed & Developed by <span class="font-bold text-emerald-600">Aditya</span> & <span class="font-bold text-emerald-600">Nistha</span>
            </p>
        </div>
    </footer>

    <script>
        // 1. Live Time Logic
        function updateLiveTime() {
            const timeDisplay = document.getElementById('live-time');
            if (!timeDisplay) return;
            const now = new Date();
            const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
            const dateString = now.toLocaleDateString('en-US', dateOptions);
            const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
            const timeString = now.toLocaleTimeString('en-US', timeOptions);
            timeDisplay.innerHTML = `<i class="fa-regular fa-clock mr-1 text-emerald-400"></i> ${dateString} • ${timeString}`;
        }
        setInterval(updateLiveTime, 1000);
        updateLiveTime();

        // 2. Sidebar Animation Logic
        const menuBtn = document.getElementById('menu-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        const sidebarMenu = document.getElementById('sidebar-menu');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        function openSidebar() {
            sidebarOverlay.classList.remove('hidden');
            setTimeout(() => sidebarOverlay.classList.remove('opacity-0'), 10);
            sidebarMenu.classList.remove('-translate-x-full');
        }

        function closeSidebar() {
            sidebarOverlay.classList.add('opacity-0');
            sidebarMenu.classList.add('-translate-x-full');
            setTimeout(() => sidebarOverlay.classList.add('hidden'), 300);
        }

        menuBtn.addEventListener('click', openSidebar);
        closeMenuBtn.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);

        // 3. AI News Fetching Logic
        const newsContainer = document.getElementById('news-container');
        const langSelector = document.getElementById('language-selector');

        async function fetchLiveNews(language) {
            // Show loading skeletons
            newsContainer.innerHTML = `
                <div class="bento-card bg-white rounded-[2rem] p-5 sm:p-6 shadow-sm border border-gray-100 w-full h-48 news-skeleton"></div>
                <div class="bento-card bg-white rounded-[2rem] p-5 sm:p-6 shadow-sm border border-gray-100 w-full h-48 news-skeleton"></div>
                <div class="bento-card bg-white rounded-[2rem] p-5 sm:p-6 shadow-sm border border-gray-100 w-full h-48 news-skeleton"></div>
                <div class="bento-card bg-white rounded-[2rem] p-5 sm:p-6 shadow-sm border border-gray-100 w-full h-48 news-skeleton hidden md:block"></div>
            `;

            try {
                // Ensure this URL matches your Vercel backend deployment!
                const response = await fetch('https://weather-backend-mocha.vercel.app/api/news', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ language: language })
                });

                const data = await response.json();

                if (data.success && data.news.length > 0) {
                    newsContainer.innerHTML = ''; // Clear skeletons
                    
                    data.news.forEach(article => {
                        // Pick an icon based on category
                        let icon = "fa-newspaper";
                        let iconColor = "text-emerald-500";
                        let bgTag = "bg-emerald-50 text-emerald-700 border-emerald-100";
                        
                        const cat = article.category.toLowerCase();
                        if(cat.includes("weather") || cat.includes("rain")) { icon = "fa-cloud-sun-rain"; iconColor = "text-blue-500"; bgTag = "bg-blue-50 text-blue-700 border-blue-100"; }
                        else if(cat.includes("market") || cat.includes("price")) { icon = "fa-arrow-trend-up"; iconColor = "text-amber-500"; bgTag = "bg-amber-50 text-amber-700 border-amber-100"; }
                        else if(cat.includes("tech") || cat.includes("subsidy")) { icon = "fa-tractor"; iconColor = "text-purple-500"; bgTag = "bg-purple-50 text-purple-700 border-purple-100"; }

                        const cardHTML = `
                            <div class="bento-card bg-white rounded-[2rem] p-5 sm:p-6 shadow-sm border border-gray-100 w-full flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-start mb-3 gap-2">
                                        <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-md uppercase tracking-wider border ${bgTag}">
                                            <i class="fa-solid ${icon} mr-1"></i> ${article.category}
                                        </span>
                                        <span class="text-[10px] font-bold text-gray-400 flex items-center gap-1 shrink-0">
                                            <i class="fa-regular fa-clock"></i> ${article.time}
                                        </span>
                                    </div>
                                    <h3 class="text-base sm:text-lg font-extrabold text-gray-900 mb-2 leading-snug">${article.title}</h3>
                                    <p class="text-sm text-gray-600 font-medium leading-relaxed">${article.summary}</p>
                                </div>
                            </div>
                        `;
                        newsContainer.insertAdjacentHTML('beforeend', cardHTML);
                    });
                } else {
                    throw new Error("News format failed.");
                }
            } catch (error) {
                console.error(error);
                newsContainer.innerHTML = `
                    <div class="col-span-1 md:col-span-2 bg-red-50 rounded-2xl p-6 border border-red-100 text-center">
                        <i class="fa-solid fa-triangle-exclamation text-red-400 text-3xl mb-3"></i>
                        <h3 class="font-extrabold text-red-800 text-lg">Unable to load live news</h3>
                        <p class="text-red-600 text-sm font-medium">Please check your internet connection or try again later.</p>
                    </div>
                `;
            }
        }

        // Fetch news initially on page load
        let currentLangName = langSelector.options[langSelector.selectedIndex].text;
        fetchLiveNews(currentLangName);

        // When language dropdown changes, fetch news in the NEW language!
        langSelector.addEventListener('change', (e) => {
            const selectedLangName = e.target.options[e.target.selectedIndex].text;
            fetchLiveNews(selectedLangName);
        });

    </script>
</body>
</html>
